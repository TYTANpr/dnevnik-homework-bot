name: Homework Bot

on:
  schedule:
    - cron: "0 11,13,15,17,19 * * 1-6"
  workflow_dispatch:

jobs:
  check-homework:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        shell: cmd
        run: python -m pip install -r requirements.txt

      - name: Run homework bot
        shell: cmd
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          EDUCATION_ID: ${{ secrets.EDUCATION_ID }}
          DNEVNIK_JWT_TOKEN: ${{ secrets.DNEVNIK_JWT_TOKEN }}
          TARGET_SUBJECTS: "Алгебра,Геометрия,Вероятность и статистика"
          LOOKAHEAD_DAYS: "7"
        run: python bot.py
        
